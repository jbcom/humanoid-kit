sonar.organization=jbcom
sonar.projectKey=jbcom_humanoid-kit
sonar.projectName=humanoid-kit
sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# The same scope vitest.config.ts instruments: shader, React, editor UI and
# worker code is proven by the browser project and the Playwright suite, which
# run uninstrumented, so lcov has no lines for it.
sonar.coverage.exclusions=src/render/**,src/react/**,src/editor/**,src/worker/**
sonar.exclusions=dist/**,dist-playground/**,docs/**,playground/**,e2e/**,data/**
