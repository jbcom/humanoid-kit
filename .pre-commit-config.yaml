default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
        exclude: ^pnpm-lock\.yaml$
      # pnpm 12 writes pnpm-lock.yaml as two YAML documents (environment, then packages); only the
      # lockfile is allowed more than one.
      - id: check-yaml
        name: check yaml (pnpm lockfile)
        files: ^pnpm-lock\.yaml$
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-toml
      - id: detect-private-key
      - id: end-of-file-fixer
        # Retained upstream mesh/binding bytes are hash-pinned provenance inputs.
        exclude: &raw_asset_sources ^(packs/[^/]+/source/.*\.(obj|mhclo)|vendor/makehuman-bodyparts04/(mindfront_nails_01_short/(mind_nails_01_short\.obj|mindfront_nails_01_short\.mhclo)|mindfront_nails_toes_01/(mind_nails_toes_01\.obj|mindfront_nails_toes_01\.mhclo)))$
      - id: trailing-whitespace
        # Authored files still receive whitespace hygiene; raw assets stay byte-exact.
        exclude: *raw_asset_sources
      - id: check-added-large-files
