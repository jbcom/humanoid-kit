default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
        exclude: ^pnpm-lock\.yaml$
      # pnpm 12 writes pnpm-lock.yaml as two YAML documents (environment, then packages); only the
      # lockfile is allowed more than one.
      - id: check-yaml
        name: check yaml (pnpm lockfile)
        files: ^pnpm-lock\.yaml$
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-toml
      - id: detect-private-key
      - id: end-of-file-fixer
        # These four MakeHuman source blobs are hash-pinned in their provenance record.
        exclude: ^vendor/makehuman-bodyparts04/(mindfront_nails_01_short/(mind_nails_01_short\.obj|mindfront_nails_01_short\.mhclo)|mindfront_nails_toes_01/(mind_nails_toes_01\.obj|mindfront_nails_toes_01\.mhclo))$
      - id: trailing-whitespace
        # Preserve the same raw upstream bytes; authored files still receive whitespace hygiene.
        exclude: ^vendor/makehuman-bodyparts04/(mindfront_nails_01_short/(mind_nails_01_short\.obj|mindfront_nails_01_short\.mhclo)|mindfront_nails_toes_01/(mind_nails_toes_01\.obj|mindfront_nails_toes_01\.mhclo))$
      - id: check-added-large-files
