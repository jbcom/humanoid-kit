name: Lighthouse capture diagnostic

on:
  push:
    branches:
      - chore/lighthouse-capture-diagnostic

permissions:
  contents: read

jobs:
  diagnose:
    name: FullPageScreenshot protocol probe
    # GitHub registers workflow_dispatch only after a file is on its default
    # branch. This isolated one-shot push instead keeps main and normal CI out
    # of the diagnostic; the approved dispatch commit must contain this marker.
    if: contains(github.event.head_commit.message, '[run-lighthouse-capture-diagnostic]')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # This runs one installed-gatherer protocol diagnostic, not the full CI suite.
      - run: node scripts/lighthouse-capture-diagnostic.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lighthouse-capture-diagnostic
          path: |
            .lighthouse/capture-diagnostic.json
            .lighthouse/capture-*.webp
          include-hidden-files: true
          if-no-files-found: error
