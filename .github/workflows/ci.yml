name: CI

on:
  pull_request:
  push:
    branches: [integration, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # `pnpm verify` remains the local all-in-one command. CI runs the same checks
  # but splits them across jobs so every supported Node version finishes below
  # the unchanged 20-minute ceiling: the static checks and the package in one job,
  # the unit suite (1021 s on one hosted runner at the integration head, against
  # that ceiling) in four file shards.
  verify-static:
    name: Verify static and package (Node ${{ matrix.node }})
    if: github.event_name != 'pull_request' || !(startsWith(github.event.pull_request.head.ref, 'release-please--') || (github.event.pull_request.user.login == 'dependabot[bot]' && contains(github.event.pull_request.title, 'non-major')))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ["24", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lockfile is in sync
        if: matrix.node == '24'
        run: |
          pnpm install --lockfile-only
          git diff --exit-code pnpm-lock.yaml
      - run: pnpm run lint
      - run: pnpm run lint:docs
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm run package:check

  verify-unit:
    name: Verify unit ${{ matrix.shard }}/4 (Node ${{ matrix.node }})
    if: github.event_name != 'pull_request' || !(startsWith(github.event.pull_request.head.ref, 'release-please--') || (github.event.pull_request.user.login == 'dependabot[bot]' && contains(github.event.pull_request.title, 'non-major')))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ["24", "26"]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Vitest shards test files exactly once, so the four shards together run the
      # whole unit project; the gate requires every one of them.
      - run: pnpm exec vitest run --project unit --shard=${{ matrix.shard }}/4

  # The browser project runs on the standard macos-15 runner's Metal GPU, the
  # canonical GPU proof (docs/ARCHITECTURE.md). Hosted SwiftShader could no
  # longer finish it: coatPlacement took 827 s there against 21 s on this
  # runner, and sphereParity was cancelled after 1123 s. The project runs on
  # the pinned Node (.nvmrc). Its tests execute in Chromium, and the static and
  # unit jobs prove the library on both supported Node releases.
  verify-browser:
    name: Verify browser ${{ matrix.shard }}/3 (Metal)
    if: github.event_name != 'pull_request' || !(startsWith(github.event.pull_request.head.ref, 'release-please--') || (github.event.pull_request.user.login == 'dependabot[bot]' && contains(github.event.pull_request.title, 'non-major')))
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - name: Require a Metal WebGL renderer
        run: node scripts/ci/assertMetalRenderer.mjs
      # Vitest shards test files exactly once; the gate requires every shard.
      - name: Run the browser shard on Metal
        env:
          HK_GPU: macos-hardware-metal
        run: pnpm exec vitest run --project browser --shard=${{ matrix.shard }}/3

  verify-bake:
    name: Verify bake (Node ${{ matrix.node }})
    if: github.event_name != 'pull_request' || !(startsWith(github.event.pull_request.head.ref, 'release-please--') || (github.event.pull_request.user.login == 'dependabot[bot]' && contains(github.event.pull_request.title, 'non-major')))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ["24", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run --project bake

  coverage-unit-shard:
    name: Coverage unit shard ${{ matrix.shard }}/6
    if: github.event_name != 'pull_request' || !(startsWith(github.event.pull_request.head.ref, 'release-please--') || (github.event.pull_request.user.login == 'dependabot[bot]' && contains(github.event.pull_request.title, 'non-major')))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Instrumented, three shards each ran past the 20-minute ceiling.
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run instrumented unit shard
        env:
          VITEST_BLOB_LABEL: coverage-unit-${{ matrix.shard }}
          VITEST_COVERAGE_SHARD: "true"
        run: >-
          pnpm exec vitest run --coverage --project unit --shard=${{ matrix.shard }}/6
          --reporter=default --reporter=blob --reporter=./scripts/ci/vitestSkipReporter.ts
      - name: Upload coverage unit shard
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-blob-unit-${{ matrix.shard }}
          path: .vitest/blob
          include-hidden-files: true
          if-no-files-found: error

  coverage-browser-shard:
    name: Coverage browser shard ${{ matrix.shard }}/3 (Metal)
    if: github.event_name != 'pull_request' || !(startsWith(github.event.pull_request.head.ref, 'release-please--') || (github.event.pull_request.user.login == 'dependabot[bot]' && contains(github.event.pull_request.title, 'non-major')))
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - name: Require a Metal WebGL renderer
        run: node scripts/ci/assertMetalRenderer.mjs
      - name: Run instrumented browser shard on Metal
        env:
          HK_GPU: macos-hardware-metal
          VITEST_BLOB_LABEL: coverage-browser-${{ matrix.shard }}
          VITEST_COVERAGE_SHARD: "true"
        run: >-
          pnpm exec vitest run --coverage --project browser --shard=${{ matrix.shard }}/3
          --reporter=default --reporter=blob --reporter=./scripts/ci/vitestSkipReporter.ts
      - name: Upload coverage browser shard
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-blob-browser-${{ matrix.shard }}
          path: .vitest/blob
          include-hidden-files: true
          if-no-files-found: error

  coverage-merge:
    name: Coverage merge and threshold gate
    needs: [coverage-unit-shard, coverage-browser-shard]
    if: github.event_name != 'pull_request' || !(startsWith(github.event.pull_request.head.ref, 'release-please--') || (github.event.pull_request.user.login == 'dependabot[bot]' && contains(github.event.pull_request.title, 'non-major')))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Names are downloaded one-by-one deliberately. A missing shard is a
      # failed required gate, never a partial coverage report.
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: coverage-blob-unit-1
          path: .vitest/blob
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: coverage-blob-unit-2
          path: .vitest/blob
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: coverage-blob-unit-3
          path: .vitest/blob
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: coverage-blob-unit-4
          path: .vitest/blob
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: coverage-blob-unit-5
          path: .vitest/blob
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: coverage-blob-unit-6
          path: .vitest/blob
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: coverage-blob-browser-1
          path: .vitest/blob
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: coverage-blob-browser-2
          path: .vitest/blob
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: coverage-blob-browser-3
          path: .vitest/blob
      # V8 blobs contain absolute source URLs. The macOS browser shards run at
      # /Users/runner while this merge runs on Ubuntu, so map both checkout roots
      # to the merge checkout before Vitest filters coverage to existing sources.
      - name: Normalize coverage blob source paths and require every shard
        run: >-
          node scripts/ci/normalizeCoverageBlobPaths.mjs .vitest/blob
          coverage-unit-1 coverage-unit-2 coverage-unit-3
          coverage-unit-4 coverage-unit-5 coverage-unit-6
          coverage-browser-1 coverage-browser-2 coverage-browser-3
      - name: Merge coverage and enforce configured thresholds
        run: |
          test -n "$(find .vitest/blob -type f -print -quit)"
          pnpm exec vitest --merge-reports .vitest/blob --coverage
          test -s coverage/lcov.info
      - name: Upload merged LCOV
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error

  docs:
    name: Docs build
    if: github.event_name != 'pull_request' || !(startsWith(github.event.pull_request.head.ref, 'release-please--') || (github.event.pull_request.user.login == 'dependabot[bot]' && contains(github.event.pull_request.title, 'non-major')))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:build
      - run: pnpm build:playground

  e2e:
    name: Playground e2e
    if: github.event_name != 'pull_request' || !(startsWith(github.event.pull_request.head.ref, 'release-please--') || (github.event.pull_request.user.login == 'dependabot[bot]' && contains(github.event.pull_request.title, 'non-major')))
    # The suite is the playground as people see it, on a GPU: the hosted macOS
    # runner's Metal at the GPU budgets (e2e/budget.ts). Under hosted SwiftShader
    # it was cancelled at 45 minutes on every run from 2026-10-14: its frame-rate-
    # bound walks sampled too few frames and figures never settled in budget.
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - name: Require a Metal WebGL renderer
        run: node scripts/ci/assertMetalRenderer.mjs
      - name: Run the playground suite on Metal
        env:
          HK_GPU: macos-hardware-metal
          PW_HEADLESS: "1"
        run: pnpm test:e2e
      # This is the GPU lane, so a GPU-lane skip fails the ledger rather than being counted.
      # Every skip must carry a known reason; the ledger counts them for the coverage gate.
      - name: Account for skipped e2e tests
        run: node scripts/ci/skipLedger.ts test-results/e2e-report.json test-results/skip-ledger.json --lane gpu
      - name: Upload the e2e skip ledger
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-skip-ledger
          path: test-results/skip-ledger.json
          if-no-files-found: ignore

  lighthouse:
    name: Lighthouse
    if: github.event_name != 'pull_request' || !(startsWith(github.event.pull_request.head.ref, 'release-please--') || (github.event.pull_request.user.login == 'dependabot[bot]' && contains(github.event.pull_request.title, 'non-major')))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # lhci drives the runner's own Chrome, through SwiftShader (scripts/lighthouserc.mjs).
      - run: pnpm lighthouse
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouse/reports
          # The reports live under a dot-directory, which upload-artifact skips by default.
          include-hidden-files: true
          if-no-files-found: warn

  sonarcloud:
    name: SonarCloud analysis
    needs: coverage-merge
    # Organization secrets are deliberately unavailable to external pull requests.
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' && !(startsWith(github.event.pull_request.head.ref, 'release-please--') || (github.event.pull_request.user.login == 'dependabot[bot]' && contains(github.event.pull_request.title, 'non-major'))))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The required merge job has already enforced Vitest's existing coverage
      # thresholds and created this same lcov path for Sonar.
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: coverage-lcov
          path: coverage
      - run: test -s coverage/lcov.info
      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  pre-commit:
    name: Pre-commit
    if: github.event_name != 'pull_request' || !(startsWith(github.event.pull_request.head.ref, 'release-please--') || (github.event.pull_request.user.login == 'dependabot[bot]' && contains(github.event.pull_request.title, 'non-major')))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m pip install --disable-pip-version-check pre-commit==4.6.1
      - run: pre-commit run --all-files --show-diff-on-failure

  gate:
    name: CI / gate
    needs: [verify-static, verify-unit, verify-browser, verify-bake, coverage-merge, docs, e2e, lighthouse, sonarcloud, pre-commit]
    if: >-
      always() && (github.event_name != 'pull_request' ||
      !(startsWith(github.event.pull_request.head.ref, 'release-please--') ||
      (github.event.pull_request.user.login == 'dependabot[bot]' && contains(github.event.pull_request.title, 'non-major'))))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # Every required job must have run and succeeded: a skipped job fails the gate.
      # Only SonarCloud may be skipped, and only where its own condition is false.
      - name: Require every native validation job
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          SONAR_RUNS: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
        run: node scripts/ci/requireJobs.ts
