name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    # Set the repository variable RELEASE_AUTOMATION_ENABLED to "true" to turn
    # release automation on. Release Please then owns every version and tag.
    if: vars.RELEASE_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      paths: ${{ steps.publishable.outputs.paths }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.CI_GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # The adult anatomy pack is held back from npm until the owner decides to
      # publish it (issue "humanoid-kit release readiness"). Set the repository
      # variable PUBLISH_ADULT_ANATOMY to "true" to release that hold. Release
      # Please still tags and releases it on GitHub.
      - id: publishable
        env:
          RELEASED: ${{ steps.release.outputs.paths_released || '[]' }}
          PUBLISH_ADULT_ANATOMY: ${{ vars.PUBLISH_ADULT_ANATOMY }}
        run: |
          paths="$(jq -c --arg adult "$PUBLISH_ADULT_ANATOMY" \
            'map(select(. != "packs/adult-anatomy" or $adult == "true"))' <<<"$RELEASED")"
          echo "Released: $RELEASED"
          echo "Publishing to npm: $paths"
          echo "paths=$paths" >> "$GITHUB_OUTPUT"

  # Publishes each package Release Please released in this run over npm trusted
  # publishing (OIDC). The trusted publisher on npmjs.com for every package names
  # this workflow file, release.yml. No npm token is stored. Before a package has
  # a trusted publisher, the owner can set the repository secret
  # NPM_BOOTSTRAP_TOKEN for the first publish and delete it afterwards.
  publish:
    name: Publish ${{ matrix.path }}
    needs: release-please
    if: needs.release-please.outputs.paths != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        path: ${{ fromJSON(needs.release-please.outputs.paths) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No registry-url: setup-node would write an .npmrc that expects an auth
      # token. The repository .npmrc already names the public registry.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Trusted publishing needs npm 11.5.1 or later; pin an exact release.
      - run: npm install --global npm@11.21.1
      - run: npm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Lint, types and the test suites already passed in CI on this commit; the
      # packed-consumer check is what protects the publish itself.
      - run: pnpm package:check
      - name: Publish ${{ matrix.path }} if this version is not on npm yet
        working-directory: ${{ matrix.path }}
        env:
          # Empty unless the owner set the bootstrap secret; only this step sees it.
          NPM_BOOTSTRAP_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          if [ -n "$NPM_BOOTSTRAP_TOKEN" ]; then
            echo "Authenticating with NPM_BOOTSTRAP_TOKEN (first publish); provenance still uses OIDC."
            npm config set "//registry.npmjs.org/:_authToken" "$NPM_BOOTSTRAP_TOKEN"
          fi
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          # Test the output, not the exit status: some npm versions exit 0 with no
          # output for a version that does not exist.
          if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
            echo "$name@$version is already published; nothing to do."
          else
            npm publish --provenance --access public
          fi
