name: GPU capability probe

on:
  pull_request:
    paths:
      - .github/workflows/gpu-capability-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standard-macos-metal:
    name: Standard macOS WebGL renderer identity
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - name: Require a hardware WebGL renderer
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';

          const browser = await chromium.launch({
            headless: true,
            args: ['--use-angle=metal', '--ignore-gpu-blocklist'],
          });
          try {
            const page = await browser.newPage();
            const renderer = await page.evaluate(() => {
              const gl = document.createElement('canvas').getContext('webgl2');
              if (!gl) return null;
              const debug = gl.getExtension('WEBGL_debug_renderer_info');
              return debug ? gl.getParameter(debug.UNMASKED_RENDERER_WEBGL) : null;
            });
            console.log(`WebGL renderer: ${renderer ?? 'unavailable'}`);
            if (!renderer || /swiftshader|software|llvmpipe/i.test(renderer))
              throw new Error(`hardware renderer required; received ${renderer ?? 'unavailable'}`);
          } finally {
            await browser.close();
          }
          NODE
