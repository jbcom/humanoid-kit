name: GPU capability probe

on:
  pull_request:
    paths:
      - .github/workflows/gpu-capability-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standard-macos-metal:
    name: Standard macOS WebGL renderer identity
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - name: Require a Metal WebGL renderer
        run: node scripts/ci/assertMetalRenderer.mjs
      - name: Run the GPU affordance proof on the verified renderer
        env:
          HK_GPU: macos-hardware-metal
        run: pnpm exec vitest run --project browser tests/browser/affordanceGpu.test.tsx
